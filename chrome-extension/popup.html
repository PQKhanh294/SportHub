<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 14px;
            color: #0f172a;
        }
        h1 {
            font-size: 14px;
            font-weight: 800;
            margin: 0 0 10px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin: 8px 0 4px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 7px 8px;
            font-size: 13px;
        }
        button {
            margin-top: 10px;
            width: 100%;
            background: #50A5B1;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        #saveStatus {
            font-size: 11px;
            color: #059669;
            margin-top: 6px;
            min-height: 14px;
        }
        h2 {
            font-size: 12px;
            font-weight: 800;
            margin: 16px 0 6px;
            color: #475569;
        }
        #log {
            max-height: 180px;
            overflow-y: auto;
            font-size: 11px;
        }
        .log-item {
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .log-ok { color: #059669; }
        .log-err { color: #e11d48; }
    </style>
</head>
<body>
    <h1>SportHub — Cấu hình Extension</h1>
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Dán API key được cấp" />
    <label>Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://sporthub-dn.id.vn" />
    <button id="saveBtn">Lưu</button>
    <div id="saveStatus"></div>

    <h2>Lịch sử gửi gần đây</h2>
    <div id="log"></div>

    <script src="popup.js"></script>
</body>
</html>
